<div data-poll="/tasks/indicator" data-interval="4000" data-reload="false" class="indicator">{% if n and waiting_for and not running %}<a href="/tasks" class="muted">Waiting for {{ waiting_for }} · {{ n }} task{{ 's' if n > 1 }}</a>{% elif n %}<span class="spinner" aria-hidden="true"></span><a href="/tasks">{% if running %}{{ labels.get(running[0].kind, running[0].kind) }}{% else %}Queued{% endif %}{% if n > 1 %} · {{ n }} tasks{% endif %}</a>{% else %}<a href="/tasks" class="muted">All caught up</a>{% endif %}</div>
