[project]
name = "career-agent"
version = "0.1.0"
description = "Personal career agent: learns your writing style, finds and ranks jobs, drafts applications, tracks employers."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.6.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.162.2",
    "feedparser>=6.0.14",
    "fpdf2>=2.9.0",
    "jinja2>=3.1.6",
    "markdown>=3.11.3",
    "numpy>=2.5.4",
    "pypdf>=7.0.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.33",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
